<h2>Colors</h2>

<!-- List View -->
<div *ngIf="mode === 'list'">
  <button class="btn btn-primary" (click)="showCreate()">Create New</button>
  <table class="table table-bordered mt-3">
    <thead>
      <tr>
        <th>Name</th>
        <th style="width: 200px;"></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let color of pagedColors">
        <td>{{ color.colorName }}</td>
        <td>
          <button class="btn btn-sm btn-warning" (click)="showEdit(color)">Edit</button>
          <button class="btn btn-sm btn-info" (click)="showDetails(color)">Details</button>
          <button class="btn btn-sm btn-danger" (click)="deleteColor(color.colorId)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="mt-3 d-flex justify-content-between">
    <button class="btn btn-secondary" (click)="prevPage()" [disabled]="currentPage === 1">Previous</button>
    <button class="btn btn-secondary" (click)="nextPage()" [disabled]="currentPage * pageSize >= colors.length">Next</button>
  </div>
</div>

<!-- Create View -->
<div *ngIf="mode === 'create'">
  <h4>Create Color</h4>
  <form (ngSubmit)="createColor()">
    <div class="form-group">
      <label>Name:</label>
      <input [(ngModel)]="form.colorName" name="name" class="form-control" required />
    </div>
    <br />
    <button type="submit" class="btn btn-success">Create</button>
    <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
  </form>
</div>

<!-- Edit View -->
<div *ngIf="mode === 'edit'">
  <h4>Edit Color</h4>
  <form (ngSubmit)="updateColor()">
    <div class="form-group">
      <label>Name:</label>
      <input [(ngModel)]="form.colorName" name="name" class="form-control" required />
    </div>
    <br />
    <button type="submit" class="btn btn-success">Update</button>
    <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
  </form>
</div>

<!-- Details View -->
<div *ngIf="mode === 'details' && selectedColor">
  <h4>Color Details</h4>
  <p><strong>ID:</strong> {{ selectedColor.colorId }}</p>
  <p><strong>Name:</strong> {{ selectedColor.colorName }}</p>
  <button class="btn btn-secondary" (click)="cancel()">Back</button>
</div>
