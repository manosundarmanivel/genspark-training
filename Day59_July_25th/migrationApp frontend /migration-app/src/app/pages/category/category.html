<h2>Categories</h2>

<!-- List View -->
<div *ngIf="mode === 'list'">
  <p>
    <button class="btn btn-primary" (click)="showCreate()">Create New</button>
  </p>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Name</th>
        <th style="width: 200px;"></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let category of pagedCategories">
        <td>{{ category.name }}</td>
        <td>
          <button class="btn btn-sm btn-warning" (click)="showEdit(category)">Edit</button>
          <button class="btn btn-sm btn-info" (click)="showDetails(category)">Details</button>
          <button class="btn btn-sm btn-danger" (click)="deleteCategory(category.categoryId)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="d-flex justify-content-between align-items-center mt-3">
    <button class="btn btn-secondary" (click)="prevPage()" [disabled]="currentPage === 1">Previous</button>
    <button class="btn btn-secondary" (click)="nextPage()" [disabled]="currentPage * pageSize >= categories.length">Next</button>
  </div>
</div>


<div *ngIf="mode === 'create'">
  <h4>Create New Category</h4>
  <form (ngSubmit)="createCategory()">
    <div class="form-group">
      <label>Name:</label>
      <input [(ngModel)]="form.name" name="name" class="form-control" required />
    </div>
    <br />
    <button type="submit" class="btn btn-success">Create</button>
    <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
  </form>
</div>


<div *ngIf="mode === 'edit'">
  <h4>Edit Category</h4>
  <form (ngSubmit)="updateCategory()">
    <div class="form-group">
      <label>Name:</label>
      <input [(ngModel)]="form.name" name="name" class="form-control" required />
    </div>
    <br />
    <button type="submit" class="btn btn-success">Update</button>
    <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
  </form>
</div>


<div *ngIf="mode === 'details' && selectedCategory">
  <h4>Category Details</h4>
  <p><strong>ID:</strong> {{ selectedCategory.categoryId }}</p>
  <p><strong>Name:</strong> {{ selectedCategory.name }}</p>
  <button class="btn btn-secondary" (click)="cancel()">Back</button>
</div>
