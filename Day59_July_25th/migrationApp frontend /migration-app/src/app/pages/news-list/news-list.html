<div class="p-6 max-w-5xl mx-auto">
  <h2 class="text-2xl font-bold mb-4">Latest News</h2>
<div class="flex justify-end mb-4 space-x-2">
  <button (click)="exportToExcel()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
    Export to Excel
  </button>
  <button (click)="exportToPDF()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
    Export to PDF
  </button>
</div>

  <div *ngIf="loading" class="text-gray-500">Loading...</div>
  <div *ngIf="error" class="text-red-600">{{ error }}</div>

  <div *ngIf="!loading && newsList.length === 0" class="text-gray-600">No news available.</div>

  <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6" *ngIf="!loading && newsList.length > 0">
    <div *ngFor="let news of newsList" class="bg-white rounded shadow-md overflow-hidden">
      <img [src]="getImageUrl(news.image)" alt="News Image" class="w-full h-40 object-cover" />
      <div class="p-4">
        <h3 class="text-xl font-semibold mb-2">{{ news.title }}</h3>
        <p class="text-sm text-gray-500 mb-2">{{ news.createdDate | date: 'mediumDate' }}</p>
        <p class="text-gray-700 text-sm">{{ news.shortDescription }}</p>
      </div>
    </div>
  </div>
</div>
